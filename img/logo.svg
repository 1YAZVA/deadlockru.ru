<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#cfe8d5"/>
      <stop offset="0.45" stop-color="#5da184"/>
      <stop offset="0.75" stop-color="#2f7d63"/>
      <stop offset="1" stop-color="#1d5c49"/>
    </linearGradient>
    <linearGradient id="metal2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4e9"/>
      <stop offset="0.5" stop-color="#7ab595"/>
      <stop offset="1" stop-color="#246a52"/>
    </linearGradient>
    <linearGradient id="eyeFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f4a54"/>
      <stop offset="0.55" stop-color="#155b66"/>
      <stop offset="1" stop-color="#0b3e4a"/>
    </linearGradient>
    <radialGradient id="irisG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0d3a42"/>
      <stop offset="0.72" stop-color="#0d3a42"/>
      <stop offset="0.78" stop-color="#d9efe2"/>
      <stop offset="1" stop-color="#bfdcc9"/>
    </radialGradient>
  </defs>

  <!-- перекрестие: вертикальная и горизонтальная планки, выступают за кольцо -->
  <g fill="url(#metal2)" stroke="#0c2431" stroke-width="7">
    <rect x="250" y="6" width="15" height="500" rx="4"/>
    <rect x="6" y="248" width="500" height="15" rx="4"/>
  </g>

  <!-- внешнее кольцо -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="url(#metal)" stroke-width="38"/>
  <circle cx="256" cy="256" r="241" fill="none" stroke="#0c2431" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="203" fill="none" stroke="#0c2431" stroke-width="5" opacity="0.9"/>

  <!-- спицы: 4 диагональные -->
  <g stroke="#2f7d63" stroke-width="15" stroke-linecap="round">
    <line x1="137" y1="137" x2="375" y2="375"/>
    <line x1="375" y1="137" x2="137" y2="375"/>
  </g>

  <!-- глаз: миндалевидная форма, кончики доходят до кольца -->
  <path d="M 62 256
           C 120 175, 200 132, 256 132
           C 312 132, 392 175, 450 256
           C 392 337, 312 380, 256 380
           C 200 380, 120 337, 62 256 Z"
        fill="url(#eyeFill)" stroke="#0c2431" stroke-width="9"/>

  <!-- радужка: светлое кольцо вокруг тёмного центра -->
  <circle cx="256" cy="256" r="58" fill="url(#irisG)" stroke="#0c2431" stroke-width="7"/>
  <circle cx="256" cy="256" r="30" fill="#0c2431"/>
</svg>
