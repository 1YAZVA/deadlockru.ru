name: live-ccu
on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут
  workflow_dispatch: {}     # и по кнопке из вкладки Actions

permissions:
  contents: write

concurrency:
  group: live-ccu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract live CCU from Steam Store
        run: python .github/live.py

      - name: Commit if changed
        run: |
          git config user.name "deadlock-live-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live.json
          if ! git diff --cached --quiet; then
            git commit -m "live: refresh concurrent players"
            git push
          fi
