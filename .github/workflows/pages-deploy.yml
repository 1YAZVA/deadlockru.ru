name: Deploy site (Next.js static export)

# Сайт = статический экспорт Next.js в GitHub Pages.
# Обновляется при каждом пуше в main (исходники/public) и вручную.

on:
  push:
    branches: [main]
    paths: ["src/**", "public/**", "next.config.ts", "package.json", "prisma/**", "scripts/**", ".github/workflows/pages-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Prisma client
        run: npx prisma generate
      - name: Static export (API routes excluded, GH data layer on)
        run: node scripts/build-gh.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .next-export
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
