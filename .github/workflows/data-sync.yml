name: Sync data + snapshots

# Обновление данных сайта: GitHub Action крутит задачи синхронизации
# (лидерборды, мета, герои, новости/патчи, киберспорт, онлайн),
# затем снимает снапшоты в public/data/*.json и коммитит их.
# Коммит триггерит pages-deploy.yml — сайт обновляется данными автоматически.

on:
  # РАСПИСАНИЕ ОТКЛЮЧЕНО (откат на старый сайт). Вернуть новый сайт:
  # раскомментировать cron и запустить workflow_dispatch.
  # schedule:
  #   - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install deps
        run: npm install --no-audit --no-fund
      - name: Prisma client
        run: npx prisma generate
      - name: Build server bundle
        run: npx next build
      - name: Copy static + public into standalone
        run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
      - name: Run sync + snapshot
        run: node scripts/gh-sync.cjs
        env:
          DATABASE_URL: "file:${{ github.workspace }}/db/custom.db"
          PORT: "3000"
      - name: Commit data
        run: |
          git config user.name "dl-data-bot"
          git config user.email "dl-data-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: auto-sync $(date -u '+%Y-%m-%dT%H:%MZ')"
            git push
          fi
